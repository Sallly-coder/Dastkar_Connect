{% extends "base.html" %}
{% block content %}
<h1>Login</h1>
<form method="post">
  <input type="email" name="email" placeholder="Email" required>
  <input type="password" name="password" placeholder="Password" required>
  <button>Log in</button>
</form>
<p><a href="{{ url_for('auth.register') }}">Create a buyer account</a></p>
{% endblock %}
