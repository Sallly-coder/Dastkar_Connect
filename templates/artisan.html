{% extends "base.html" %}
{% block content %}
<h1>My task</h1>

{% if task %}
<div class="table-wrap">
<table>
  <thead><tr><th>#</th><th>What to make</th><th>Status</th><th>Action</th></tr></thead>
  <tbody>
  <tr>
    <td>{{ task.id }}</td>
    <td>
      {{ task.translated_spec }}
      {% if task.inspiration_url %}
        <br>
        <a href="{{ task.inspiration_url }}" target="_blank">
          <img class="thumb" src="{{ task.inspiration_url }}" alt="Buyer's reference photo">
        </a>
      {% endif %}
    </td>
    <td>{{ task.status }}</td>
    <td>
      <form method="post"
            action="{{ url_for('pages.artisan_upload', order_id=task.id) }}"
            enctype="multipart/form-data">
        <input class="big-btn" type="file" name="photo"
               accept="image/jpeg,image/png" capture="environment" required>
        <button class="big-btn">Submit for review</button>
      </form>
    </td>
  </tr>
  </tbody>
</table>
</div>
{% else %}
<p>No task assigned right now.</p>
{% endif %}
{% endblock %}
