<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dastkar Connect</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Correct Flask CSS Link -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">}">
</head>
<body>

  <!-- Centered Navigation Header -->
 <header class="main-header">
  <div class="nav-container">
    
    <div class="nav-left">
      <a href="/" class="nav-link">Home</a>
    </div>

    <!-- CENTERED LOGO -->
    <div class="nav-center">
      <a href="/" class="brand-logo">
        <span class="logo-icon">🪡</span>
        <span class="logo-text">Dastkar<span class="logo-highlight">Connect</span></span>
      </a>
    </div>

    <div class="nav-right">
      {% if g.user %}
        <a href="{{ url_for('auth.logout') }}" class="nav-btn-secondary">Logout</a>
      {% else %}
        <a href="{{ url_for('auth.login') }}" class="nav-btn-primary">Sign In</a>
      {% endif %}
    </div>

  </div>
</header>

  <!-- Flash Messages Section -->
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

</body>
</html>
